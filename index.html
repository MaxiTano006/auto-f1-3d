<!DOCTYPE html>
<html lang="es-AR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auto F1 · Visor 3D y AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --fondo: #0d0d0d;
            --panel: #141414;
            --linea: #2a2a2a;
            --texto: #f2f2f2;
            --suave: #9a9a9a;
            --acento: #e30613;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 24px 16px 8px;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
        }

        .etiqueta {
            font-size: 12px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--acento);
            margin-bottom: 8px;
        }

        h1 {
            font-size: 26px;
            letter-spacing: -.01em;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            padding: 16px;
        }

        .escena {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--linea);
            height: 55vh;
            min-height: 320px;
        }

        model-viewer {
            display: block;
            width: 100%;
            height: 100%;
            --progress-bar-height: 0px;
            --poster-color: transparent;
        }

        .capa {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            text-align: center;
            background: var(--panel);
        }

        .capa p {
            color: var(--suave);
            line-height: 1.5;
        }

        .barra {
            width: 60%;
            max-width: 280px;
            height: 4px;
            background: var(--linea);
        }

        #barra {
            height: 100%;
            width: 0;
            background: var(--acento);
        }

        #reintentar {
            font: inherit;
            font-weight: 600;
            padding: 12px 20px;
            border: 1px solid var(--acento);
            background: transparent;
            color: var(--texto);
            cursor: pointer;
        }

        .modos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin-top: 16px;
            border: 1px solid var(--linea);
        }

        .modos button {
            font: inherit;
            font-weight: 600;
            font-size: 16px;
            padding: 16px;
            border: 0;
            border-radius: 0;
            cursor: pointer;
            background: var(--panel);
            color: var(--texto);
        }

        .modos button+button {
            border-left: 1px solid var(--linea);
        }

        .modos button.activo {
            background: var(--acento);
            color: #fff;
        }

        .modos button:focus-visible,
        #reintentar:focus-visible {
            outline: 2px solid var(--texto);
            outline-offset: -4px;
        }

        .aviso {
            margin-top: 12px;
            padding: 12px;
            border: 1px solid var(--acento);
            line-height: 1.5;
        }

        #diag {
            margin-top: 12px;
            padding: 12px;
            border: 1px solid var(--linea);
            font-family: monospace;
            font-size: 12px;
            color: var(--suave);
            white-space: pre-wrap;
        }

        footer {
            border-top: 1px solid var(--linea);
            padding: 16px;
            text-align: center;
            color: var(--suave);
            font-size: 13px;
        }

        .oculto {
            display: none !important;
        }

        @media (min-width:720px) {
            h1 {
                font-size: 38px;
            }

            .escena {
                height: 65vh;
            }
        }
    </style>
</head>

<body>
    <header>
        <p class="etiqueta">Programación Web con IA</p>
        <h1>Auto F1 · Visor 3D y AR</h1>
    </header>

    <main>
        <div class="escena">
            <model-viewer id="mv" src="auto.glb" alt="Modelo 3D de un auto de Fórmula 1" camera-controls auto-rotate
                touch-action="pan-y" shadow-intensity="1" shadow-softness="1" exposure="1" environment-image="neutral"
                camera-orbit="35deg 75deg auto" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed"
                loading="eager">
            </model-viewer>

            <div id="cargando" class="capa">
                <p>Cargando modelo… <span id="pct">0%</span></p>
                <div class="barra">
                    <div id="barra"></div>
                </div>
            </div>

            <div id="fallo" class="capa oculto">
                <p>No se pudo cargar el modelo.</p>
                <button id="reintentar" type="button">Reintentar</button>
            </div>
        </div>

        <div class="modos">
            <button id="btn3d" class="activo" type="button" aria-pressed="true">Ver en 3D</button>
            <button id="btnAR" type="button" aria-pressed="false">Ver en AR</button>
        </div>

        <p id="aviso" class="aviso oculto" role="status"></p>
        <div id="diag">diagnóstico: esperando eventos…</div>
    </main>

    <footer>
        <p>Máximo Beneventano · Programación Web con IA · 2026</p>
    </footer>

    <script>
        (function () {
            'use strict';
            var mv = document.getElementById('mv');
            var cargando = document.getElementById('cargando');
            var fallo = document.getElementById('fallo');
            var barra = document.getElementById('barra');
            var pct = document.getElementById('pct');
            var btn3d = document.getElementById('btn3d');
            var btnAR = document.getElementById('btnAR');
            var aviso = document.getElementById('aviso');
            var diag = document.getElementById('diag');
            var reintentar = document.getElementById('reintentar');

            function log(t) { diag.textContent = 'diagnóstico: ' + t; }

            mv.addEventListener('progress', function (e) {
                var p = Math.round(e.detail.totalProgress * 100);
                barra.style.width = p + '%';
                pct.textContent = p + '%';
            });

            mv.addEventListener('load', function () {
                cargando.classList.add('oculto');
                fallo.classList.add('oculto');
                log('LOAD OK · modelo cargado');
            });

            mv.addEventListener('error', function (e) {
                cargando.classList.add('oculto');
                fallo.classList.remove('oculto');
                var d = e.detail || {};
                log('ERROR · type=' + (d.type || '?') + ' · ' + (d.sourceError ? String(d.sourceError) : 'sin detalle'));
            });

            reintentar.addEventListener('click', function () { location.reload(); });

            btn3d.addEventListener('click', function () {
                btn3d.classList.add('activo'); btnAR.classList.remove('activo');
                btn3d.setAttribute('aria-pressed', 'true'); btnAR.setAttribute('aria-pressed', 'false');
                aviso.classList.add('oculto');
                mv.autoRotate = true;
            });

            btnAR.addEventListener('click', function () {
                btnAR.classList.add('activo'); btn3d.classList.remove('activo');
                btnAR.setAttribute('aria-pressed', 'true'); btn3d.setAttribute('aria-pressed', 'false');
                if (mv.canActivateAR) {
                    aviso.classList.add('oculto');
                    mv.activateAR();
                } else {
                    aviso.textContent = 'Este dispositivo o navegador no soporta realidad aumentada. Probá desde un celular con Chrome en Android o Safari en iPhone.';
                    aviso.classList.remove('oculto');
                }
            });

            mv.addEventListener('ar-status', function (e) {
                if (e.detail.status === 'not-presenting' || e.detail.status === 'failed') {
                    btn3d.classList.add('activo'); btnAR.classList.remove('activo');
                    mv.autoRotate = true;
                }
            });
        })();
    </script>
</body>

</html>
